services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agent_relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_relay"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      RELAY_DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@postgres:5432/agent_relay"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RELAY_PORT:-8000}:8000"

volumes:
  postgres_data:
